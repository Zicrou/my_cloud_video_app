
name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  laravel-tests:
    name: Run Laravel Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip, intl
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test

      - name: Build Docker image
        run: docker build -t my-cloud-video-app:ci .

  publish-to-ecr:
    name: Publish Docker image to Amazon ECR
    needs: laravel-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      
      - name: Debug OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          # Vérifier que GitHub fournit les variables OIDC
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Variable OIDC URL absente}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Variable OIDC token absente}"

          # Récupérer le jeton
          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(printf '%s' "$RESPONSE" | jq -er '.value')

          # Décoder uniquement les claims utiles, sans afficher le jeton
          TOKEN="$TOKEN" python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          keys = [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
          ]

          print(json.dumps(
              {key: claims.get(key) for key in keys},
              indent=2
          ))
          PY


      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::731372490360:role/GitHubActionsECRPushRole
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t 731372490360.dkr.ecr.eu-north-1.amazonaws.com/my-cloud-video-app:latest \
            -t 731372490360.dkr.ecr.eu-north-1.amazonaws.com/my-cloud-video-app:${{ github.sha }} \
            .

      - name: Push Docker image to ECR
        run: |
          docker push 731372490360.dkr.ecr.eu-north-1.amazonaws.com/my-cloud-video-app:latest
          docker push 731372490360.dkr.ecr.eu-north-1.amazonaws.com/my-cloud-video-app:${{ github.sha }}
