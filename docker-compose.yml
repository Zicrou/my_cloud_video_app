services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-cloud-video-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - cloud-video

  nginx:
    image: nginx:alpine
    container_name: my-cloud-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - cloud-video

  mysql:
    image: mysql:8.4
    container_name: my-cloud-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: video_app
      MYSQL_USER: cloudvideo
      MYSQL_PASSWORD: cloudvideo_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cloud-video

networks:
  cloud-video:

volumes:
  mysql_data: